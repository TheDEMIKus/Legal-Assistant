services:
  legal-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-legal-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=data
    volumes:
      # Монтируем базу знаний и папку кэша/данных, чтобы не пересчитывать эмбеддинги при рестарте
      - ./knowledge-base:/app/knowledge-base:ro
      - ./data:/app/data
    restart: unless-stopped